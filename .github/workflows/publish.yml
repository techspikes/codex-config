name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publish
  queue: max

jobs:
  verify-ci:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f branch=main -f event=push -f "head_sha=$GITHUB_SHA" -f status=success -F per_page=1 --jq '.total_count > 0')

          # Require passing CI for the exact commit pushed to main.
          if [[ $passed != true ]]; then
            echo "No successful main push CI run was found for $GITHUB_SHA." >&2
            exit 1
          fi

  publish:
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag
        run: |
          version=$(jq -er '.version' package.json)
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          # Require a stable package version and its matching release tag.
          if [[ ! $version =~ $stable || $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match the stable package version v$version." >&2
            exit 1
          fi

          # Reject tags that point outside main's history.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA must be on main." >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Stage a new stable version for npm approval
        run: |
          package=$(jq -er '.name' package.json)
          version=$(jq -er '.version' package.json)

          # npm resolves the SemVer range and excludes prereleases.
          if published=$(npm view "$package@>=$version" name version gitHead --json --loglevel=silent); then
            # Check the source of an exact version match before skipping publication.
            commit=$(jq -r --arg version "$version" '(if type == "array" then .[] else . end) | select(.version == $version) | (.gitHead // "missing")' <<< "$published")

            # Fail if npm cannot confirm the exact version came from this commit.
            if [[ -n $commit && $commit != "$GITHUB_SHA" ]]; then
              echo "npm has $version from a different or unknown commit." >&2
              exit 1
            fi

            echo "npm already has $version or a newer stable version."
          elif jq -e '.error.code == "E404"' <<< "$published" > /dev/null; then
            # Stage when npm finds no stable version in the requested range.
            npm stage publish --access public
          else
            # Report lookup errors so a failed check cannot stage a package.
            echo "$published" >&2
            exit 1
          fi
